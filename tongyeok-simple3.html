<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#e8ecfb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통역방송">
<title>통역 방송</title>
<style>
:root{--bg:#e8ecfb;--tx:#111827;--mu:#4b5563;--bl:#3b4ef0;--rd:#e11d48;--wh:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow-x:hidden}
.scr{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 22px 30px;display:flex;flex-direction:column}
[hidden]{display:none!important}
.top{height:48px;display:flex;align-items:center}
.back{background:none;border:0;font-size:34px;color:var(--tx);padding:0 8px 0 0;line-height:1;cursor:pointer}
h1{text-align:center;font-size:34px;font-weight:900;margin:40px 0 60px;letter-spacing:-.5px}
.lab{text-align:center;color:var(--mu);font-size:19px}
.big{text-align:center;font-size:40px;font-weight:900;margin:16px 0 4px;line-height:1.2}
.sub{text-align:center;color:var(--mu);font-size:17px;min-height:22px}
.ask{text-align:center;color:var(--mu);font-size:19px;margin:56px 0 40px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ok{background:var(--bl);color:#fff;border:0;border-radius:14px;padding:22px;font-size:22px;font-weight:900;box-shadow:0 4px 10px rgba(59,78,240,.3);cursor:pointer}
.gl{background:var(--wh);border:0;border-radius:14px;padding:16px;font-size:34px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer}
/* 언어 목록 */
.list{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column}
.list .hd{max-width:520px;width:100%;margin:0 auto;padding:18px 22px 10px}
.list .hd b{display:block;font-size:24px;margin:6px 0 12px}
.list input{width:100%;padding:15px;border-radius:12px;border:0;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.list .bd{flex:1;overflow-y:auto;max-width:520px;width:100%;margin:0 auto;padding:6px 22px 30px}
.list .bd button{display:flex;align-items:center;gap:14px;width:100%;background:var(--wh);border:2px solid transparent;border-radius:12px;padding:14px 16px;margin-bottom:8px;font-size:19px;font-weight:800;text-align:left;color:var(--tx);cursor:pointer}
.list .bd button.on{border-color:var(--bl)}
.list .bd button i{font-style:normal;font-size:28px}
.list .bd button small{display:block;font-size:14px;font-weight:500;color:var(--mu)}
/* 방송 화면 */
.lang2{text-align:center;font-size:30px;font-weight:900;margin:6px 0 2px}
.micw{display:flex;justify-content:center;margin:34px 0 18px}
#mic{width:210px;height:210px;border-radius:50%;border:0;background:var(--bl);color:#fff;font-size:22px;font-weight:900;box-shadow:0 0 0 12px rgba(59,78,240,.15);cursor:pointer;line-height:1.3}
#mic span{display:block;font-size:70px}
#mic.on{background:var(--rd);box-shadow:0 0 0 12px rgba(225,29,72,.2);animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 26px rgba(225,29,72,.06)}}
#st{text-align:center;font-size:20px;font-weight:900;color:var(--bl);min-height:28px}
.out{background:var(--wh);border-radius:16px;padding:16px;margin:20px 0;min-height:120px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#srcT{color:var(--mu);font-size:16px;line-height:1.5;min-height:22px}
#dstT{font-size:24px;font-weight:900;line-height:1.45;margin-top:8px;word-break:break-word}
.spd{background:var(--wh);border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.spd .r{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin-bottom:8px}
.spd input{width:100%;accent-color:var(--bl);height:28px}
.spd .e{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin-bottom:10px}
</style>
</head>
<body>

<!-- ① 첫 화면 : 언어 확인 -->
<div class="scr" id="s1">
  <div class="top"></div>
  <h1>실시간 통역 방송</h1>
  <div class="lab">방송할 언어</div>
  <div class="big" id="l1"></div>
  <div class="sub" id="n1"></div>
  <div class="ask">이 언어로 방송하시겠습니까?</div>
  <div class="btns"><button class="ok" id="go">확인</button><button class="gl" id="pick1" aria-label="언어 바꾸기">🌐</button></div>
</div>

<!-- ② 방송 화면 : 마이크 + 속도 -->
<div class="scr" id="s2" hidden>
  <div class="top"><button class="back" id="back" aria-label="뒤로">‹</button></div>
  <div class="lab">방송 언어</div>
  <div class="lang2" id="l2"></div>
  <div class="micw"><button id="mic"><span>🎙️</span>눌러서 시작</button></div>
  <div id="st">버튼을 누르고 말씀하세요</div>
  <div class="out"><div id="srcT">한국어로 말하면 여기에 나옵니다</div><div id="dstT"></div></div>
  <div class="spd">
    <div class="r"><span>말하기 속도</span><span id="rv"></span></div>
    <input type="range" id="rate" min="0.6" max="1.5" step="0.1">
    <div class="e"><span>느리게</span><span>빠르게</span></div>
  </div>
</div>

<!-- 언어 목록 -->
<div class="list" id="lst" hidden>
  <div class="hd"><button class="back" id="lstX" aria-label="닫기">‹</button><b>언어 선택</b><input id="q" placeholder="🔍 나라·언어 검색 (예: 말레이)"></div>
  <div class="bd" id="grid"></div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function ls(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){} return null; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  /* 번역코드 · 음성코드 · 국기 · 한국어 이름 · 원어 이름 · (구글음성코드) */
  var LANGS = [
    ['vi','vi-VN','🇻🇳','베트남어','Tiếng Việt'],['zh-CN','zh-CN','🇨🇳','중국어','中文'],['th','th-TH','🇹🇭','태국어','ไทย'],
    ['km','km-KH','🇰🇭','캄보디아어','ខ្មែរ'],['ne','ne-NP','🇳🇵','네팔어','नेपाली'],['uz','uz-UZ','🇺🇿','우즈베크어','Oʻzbek'],
    ['id','id-ID','🇮🇩','인도네시아어','Bahasa Indonesia'],['ms','ms-MY','🇲🇾','말레이시아어','Bahasa Melayu'],['tl','fil-PH','🇵🇭','필리핀어','Filipino','fil'],
    ['my','my-MM','🇲🇲','미얀마어','မြန်မာ'],['mn','mn-MN','🇲🇳','몽골어','Монгол'],['ru','ru-RU','🇷🇺','러시아어','Русский'],
    ['kk','kk-KZ','🇰🇿','카자흐어','Қазақ'],['ky','ky-KG','🇰🇬','키르기스어','Кыргызча'],['si','si-LK','🇱🇰','스리랑카어','සිංහල'],
    ['bn','bn-BD','🇧🇩','방글라데시어','বাংলা'],['ur','ur-PK','🇵🇰','파키스탄어','اردو'],['hi','hi-IN','🇮🇳','힌디어','हिन्दी'],
    ['ta','ta-IN','🇮🇳','타밀어','தமிழ்'],['lo','lo-LA','🇱🇦','라오스어','ລາວ'],['en','en-US','🇺🇸','영어','English'],
    ['ja','ja-JP','🇯🇵','일본어','日本語'],['zh-TW','zh-TW','🇹🇼','중국어(번체)','繁體中文'],['uk','uk-UA','🇺🇦','우크라이나어','Українська'],
    ['tg','tg-TJ','🇹🇯','타지크어','Тоҷикӣ'],['tk','tk-TM','🇹🇲','투르크멘어','Türkmençe'],['az','az-AZ','🇦🇿','아제르바이잔어','Azərbaycan'],
    ['ka','ka-GE','🇬🇪','조지아어','ქართული'],['hy','hy-AM','🇦🇲','아르메니아어','Հայերեն'],['fa','fa-IR','🇮🇷','페르시아어','فارسی'],
    ['ps','ps-AF','🇦🇫','파슈토어','پښتو'],['ar','ar-SA','🇸🇦','아랍어','العربية'],['tr','tr-TR','🇹🇷','튀르키예어','Türkçe'],
    ['iw','he-IL','🇮🇱','히브리어','עברית'],['fr','fr-FR','🇫🇷','프랑스어','Français'],['es','es-ES','🇪🇸','스페인어','Español'],
    ['pt','pt-BR','🇧🇷','포르투갈어','Português'],['de','de-DE','🇩🇪','독일어','Deutsch'],['it','it-IT','🇮🇹','이탈리아어','Italiano'],
    ['nl','nl-NL','🇳🇱','네덜란드어','Nederlands'],['pl','pl-PL','🇵🇱','폴란드어','Polski'],['ro','ro-RO','🇷🇴','루마니아어','Română'],
    ['el','el-GR','🇬🇷','그리스어','Ελληνικά'],['cs','cs-CZ','🇨🇿','체코어','Čeština'],['hu','hu-HU','🇭🇺','헝가리어','Magyar'],
    ['bg','bg-BG','🇧🇬','불가리아어','Български'],['sr','sr-RS','🇷🇸','세르비아어','Српски'],['sw','sw-KE','🇰🇪','스와힐리어','Kiswahili'],
    ['am','am-ET','🇪🇹','암하라어','አማርኛ'],['so','so-SO','🇸🇴','소말리어','Soomaali']
  ].map(function(a){ return { g:a[0], t:a[1], fl:a[2], ko:a[3], na:a[4], gt:a[5] || a[0] }; });
  function byG(g){ for (var i = 0; i < LANGS.length; i++) if (LANGS[i].g === g) return LANGS[i]; return null; }
  var SRC = { g:'ko', t:'ko-KR' };
  var TGT = byG(ls('dnTrLang')) || byG('ms');
  var rate = +ls('dnTrRate') || 1;

  /* ---------- 화면 ---------- */
  function show(id){ ['s1', 's2'].forEach(function(x){ $(x).hidden = x !== id; }); window.scrollTo(0, 0); }
  function paint(){
    $('l1').textContent = TGT.fl + ' ' + TGT.ko; $('n1').textContent = TGT.na;
    $('l2').textContent = TGT.fl + ' ' + TGT.ko;
  }
  function drawGrid(){
    var q = $('q').value.trim().toLowerCase();
    $('grid').innerHTML = LANGS.filter(function(L){ return !q || (L.ko + L.na + L.g).toLowerCase().indexOf(q) >= 0; }).map(function(L){
      return '<button data-g="' + L.g + '"' + (L === TGT ? ' class="on"' : '') + '><i>' + L.fl + '</i><span>' + esc(L.ko) + '<small>' + esc(L.na) + '</small></span></button>';
    }).join('') || '<div class="sub">찾는 언어가 없습니다</div>';
  }
  function openList(){ $('q').value = ''; drawGrid(); $('lst').hidden = false; $('grid').scrollTop = 0; }
  $('pick1').onclick = openList;
  $('lstX').onclick = function(){ $('lst').hidden = true; };
  $('q').oninput = drawGrid;
  $('grid').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; TGT = byG(b.dataset.g); ls('dnTrLang', TGT.g); paint(); $('lst').hidden = true; };
  $('go').onclick = function(){ unlock(); show('s2'); };
  $('back').onclick = function(){ stopAll(); show('s1'); };
  function rv(){ $('rv').textContent = rate.toFixed(1) + '배'; }
  $('rate').value = rate; rv();
  $('rate').oninput = function(){ rate = +this.value; ls('dnTrRate', rate); rv(); };
  paint();

  /* ---------- 번역 ---------- */
  function translate(text, sl, tl){
    var u = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text);
    return fetch(u).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(j){
      var s = (j[0] || []).map(function(x){ return x[0]; }).join('').trim(); if (!s) throw 0; return s;
    }).catch(function(){
      var m = function(c){ return c === 'iw' ? 'he' : c; };
      return fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + m(sl) + '|' + m(tl))
        .then(function(r){ return r.json(); }).then(function(j){ var s = j && j.responseData && j.responseData.translatedText; if (!s) throw new Error('fail'); return s; });
    });
  }

  /* ---------- 음성 출력 (휴대폰 음성 → 없으면 구글 음성) ---------- */
  var SS = window.speechSynthesis, voices = [];
  function loadV(){ try{ voices = SS ? SS.getVoices() : []; }catch(e){ voices = []; } }
  loadV(); if (SS) SS.onvoiceschanged = loadV;
  function findVoice(L){
    if (!voices.length) loadV();
    var t = L.t.toLowerCase(), p = t.split('-')[0], alt = p === 'he' ? 'iw' : p === 'fil' ? 'tl' : p;
    var nl = function(v){ return String(v.lang || '').replace('_', '-').toLowerCase(); };
    return voices.filter(function(v){ return nl(v) === t; })[0] ||
           voices.filter(function(v){ var x = nl(v).split('-')[0]; return x === p || x === alt; })[0] || null;
  }
  function chunks(s, max){
    var parts = s.match(/[^.!?。！？\n]+[.!?。！？]*/g) || [s], out = [], cur = '';
    parts.forEach(function(p){
      p = p.trim(); if (!p) return;
      if ((cur + ' ' + p).length <= max){ cur = cur ? cur + ' ' + p : p; return; }
      if (cur) out.push(cur);
      while (p.length > max){ out.push(p.slice(0, max)); p = p.slice(max); }
      cur = p;
    });
    if (cur) out.push(cur);
    return out;
  }
  function synthOne(text, L, voice){
    return new Promise(function(res){
      var done = false, fin = function(){ if (!done){ done = true; res(); } };
      try{
        var u = new SpeechSynthesisUtterance(text);
        u.lang = L.t; if (voice) u.voice = voice; u.rate = rate; u.volume = 1;
        u.onend = u.onerror = fin;
        SS.speak(u);
        setTimeout(fin, Math.max(4000, text.length * 220 / rate + 2500));
      }catch(e){ fin(); }
    });
  }
  function speakSynth(text, L, voice){
    if (!SS) return Promise.resolve(false);
    try{ SS.cancel(); }catch(e){}
    var cs = chunks(text, 180), i = 0;
    return (function nx(){ if (i >= cs.length) return Promise.resolve(true); return synthOne(cs[i++], L, voice).then(nx); })();
  }
  var AU = new Audio();
  function playUrl(u){
    return new Promise(function(res){
      var done = false, fin = function(ok){ if (!done){ done = true; res(ok); } };
      AU.onended = function(){ fin(true); }; AU.onerror = function(){ fin(false); };
      AU.src = u; try{ AU.playbackRate = rate; }catch(e){}
      var p = AU.play(); if (p && p.catch) p.catch(function(){ fin(false); });
      setTimeout(function(){ fin(true); }, 30000);
    });
  }
  function speakGoogle(text, L){
    var cs = chunks(text, 190), i = 0;
    return (function nx(){
      if (i >= cs.length) return Promise.resolve(true);
      var c = cs[i++];
      return playUrl('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + encodeURIComponent(L.gt) + '&q=' + encodeURIComponent(c) + '&textlen=' + c.length)
        .then(function(ok){ return ok ? nx() : false; });
    })();
  }
  function speak(text, L){
    var v = findVoice(L);
    if (v) return speakSynth(text, L, v);
    return speakGoogle(text, L).then(function(ok){ if (!ok) return speakSynth(text, L, null); });
  }
  function unlock(){
    try{ if (SS){ var u = new SpeechSynthesisUtterance(' '); u.volume = 0; SS.speak(u); } }catch(e){}
    try{ AU.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='; var p = AU.play(); if (p && p.catch) p.catch(function(){}); }catch(e){}
  }

  /* ---------- 마이크 (음성 인식) ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var rec = null, on = false, busy = false, wl = null;
  function setSt(t){ $('st').textContent = t; }
  function startRec(){
    if (!SR || !on || busy || rec) return;
    var r = new SR(); rec = r;
    r.lang = SRC.t; r.continuous = !IOS; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = function(e){
      var it = '', fin = '';
      for (var i = e.resultIndex; i < e.results.length; i++){ var t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else it += t; }
      if (it) $('srcT').textContent = it;
      if (fin.trim()) handle(fin.trim());
    };
    r.onerror = function(e){
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ on = false; micUI(); setSt('❌ 마이크 권한을 허용해 주세요'); }
    };
    r.onend = function(){ if (rec === r) rec = null; if (on && !busy) setTimeout(startRec, 250); };
    try{ r.start(); setSt('🎙️ 듣는 중… 말씀하세요'); }catch(e){ rec = null; }
  }
  function stopRec(){ var r = rec; rec = null; if (r){ try{ r.onend = null; r.abort(); }catch(e){} } }
  function micUI(){ $('mic').className = on ? 'on' : ''; $('mic').innerHTML = on ? '<span>⏹️</span>눌러서 멈춤' : '<span>🎙️</span>눌러서 시작'; if (!on) setSt('버튼을 누르고 말씀하세요'); }
  function wake(o){ try{ if (o && navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wl = w; }).catch(function(){}); else if (!o && wl){ wl.release(); wl = null; } }catch(e){} }
  document.addEventListener('visibilitychange', function(){ if (on && document.visibilityState === 'visible') wake(true); });
  function stopAll(){ on = false; stopRec(); wake(false); try{ SS && SS.cancel(); AU.pause(); }catch(e){} micUI(); }

  $('mic').onclick = function(){
    if (!SR){ setSt('이 브라우저는 음성 인식이 안 됩니다'); return; }
    on = !on; micUI();
    if (on){ unlock(); wake(true); startRec(); } else stopAll();
  };

  /* ---------- 말 → 번역 → 스피커 방송 ---------- */
  function handle(text){
    if (busy) return;
    busy = true; stopRec();   // 방송하는 동안 마이크 끔 (스피커 소리를 다시 듣지 않게)
    var L = TGT;
    $('srcT').textContent = text; $('dstT').textContent = '…'; setSt('🔄 번역 중…');
    translate(text, SRC.g, L.g).then(function(tr){
      $('dstT').textContent = tr; setSt('🔊 방송 중…');
      return speak(tr, L);
    }).catch(function(){
      $('dstT').textContent = ''; setSt('❌ 번역 실패 — 인터넷을 확인하세요');
      return sleep(1500);
    }).then(function(){
      busy = false;
      if (on){ setSt('🎙️ 듣는 중… 말씀하세요'); setTimeout(startRec, 300); }
    });
  }
})();
</script>
</body>
</html>
